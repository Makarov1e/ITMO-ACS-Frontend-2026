<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TableTime — учебный интерфейс бронирования ресторанов в Санкт-Петербурге.">
  <title>Вход — TableTime</title>
</head>
<body data-page="login">
  <a class="visually-hidden-focusable position-absolute top-0 start-0 p-3 bg-white" href="#main-content">Перейти к содержимому</a>
  <header id="site-header"></header>
  <main id="main-content">
<section class="container auth-shell"><div class="row g-4 align-items-stretch w-100 justify-content-center"><div class="col-lg-5 d-none d-lg-block"><div class="auth-visual"><div><p class="eyebrow">TableTime</p><h1 class="section-title">Ваши планы — в одном спокойном месте</h1></div></div></div><div class="col-lg-5"><div class="auth-card"><p class="eyebrow">Учебная сессия</p><h1 class="section-title mb-2">Войти</h1><p class="lead-muted">Это локальная демонстрация: реальные пароли и данные не используются.</p><div id="loginMessage" class="alert" hidden role="alert"></div><form id="loginForm" novalidate><div class="mb-3"><label class="form-label" for="loginEmail">E-mail</label><input class="form-control" id="loginEmail" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="mb-3"><label class="form-label" for="loginPassword">Пароль</label><input class="form-control" id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn btn-clay w-100" type="submit">Войти в учебный профиль</button></form><div class="notice small mt-4"><strong>Демо-доступ:</strong> demo@tabletime.local / учебный-доступ<br><button id="demoLogin" class="btn btn-link p-0 small">Подставить демо-данные</button></div><p class="mb-0 mt-4 small">Нет учебного профиля? <a href="register.html">Зарегистрироваться</a></p></div></div></div></section>
</main>
  <footer id="site-footer"></footer>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
